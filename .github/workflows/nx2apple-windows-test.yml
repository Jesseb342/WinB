name: NX2Apple Windows IPA test

on:
  workflow_dispatch:
    inputs:
      content:
        description: Game content to include (Sea of Stars test)
        type: choice
        required: true
        default: Base game + update (no DLC)
        options:
          - Base game only
          - Base game + update (no DLC)
          - Base game + DLC (no update)
          - Base game + update + DLC
      upload_ipa:
        description: Upload the IPA as an Actions artifact. On a public repo, anyone with read access may be able to download it.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: nx2apple-windows-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-ipa:
    name: Build iOS IPA on Windows (NX2Apple)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      NSPB_REPO: ${{ github.workspace }}/nx2apple/engine
      GAME_URL: ${{ secrets.Game_URL }}
      UPDATE_URL: ${{ secrets.Update_URL }}
      DLC_URL: ${{ secrets.DLC_URL }}
      KEYS_BASE64: ${{ secrets.Keys_URL }}
      METAL_TOOLS_URL: ${{ secrets.Metal_URL || secrets.MetalTools_URL }}
      METAL_TOOLS_SHA256: ${{ secrets.MetalTools_SHA256 }}
      # NX2Apple logs Unicode symbols during extraction; force UTF-8 for piped Python output on Windows.
      PYTHONUTF8: "1"
      # Prevent persistent MSBuild/.NET worker servers from surviving the extractor build.
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      MSBUILD_TELEMETRY_OPTOUT: "1"
      CONTENT_SELECTION: ${{ inputs.content }}

    steps:
      - name: Checkout WinB workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest NX2Apple
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LNPANDY/NX2Apple
          ref: main
          path: nx2apple
          fetch-depth: 1
          persist-credentials: false

      - name: Restore cached Windows toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\NS Port Builder\tools
            ~\AppData\Local\NS Port Builder\sdks
          key: nx2apple-toolchain-${{ runner.os }}-${{ hashFiles('nx2apple/frontend-qt/nspb_qt/win/toolchain.py', 'nx2apple/frontend-qt/nspb_qt/win/fetch.py', 'nx2apple/frontend-qt/nspb_qt/win/sdk_fetch.py') }}

      - name: Record NX2Apple revision
        shell: bash
        run: |
          set -euo pipefail
          echo "NX2Apple commit: $(git -C nx2apple rev-parse HEAD)"
          echo "NX2Apple commit: $(git -C nx2apple rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets before toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GAME_URL:-}" || -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Add the Game_URL and Keys_URL repository secrets (same values used by Wiz)."
            exit 1
          fi
          case "$CONTENT_SELECTION" in
            "Base game + update (no DLC)"|"Base game + update + DLC")
              if [[ -z "${UPDATE_URL:-}" ]]; then
                echo "::error::The selected content needs the Update_URL repository secret."
                exit 1
              fi
              ;;
          esac
          case "$CONTENT_SELECTION" in
            "Base game + DLC (no update)"|"Base game + update + DLC")
              if [[ -z "${DLC_URL:-}" ]]; then
                echo "::error::The selected content needs the DLC_URL repository secret."
                exit 1
              fi
              ;;
          esac
          if [[ -z "${METAL_TOOLS_URL:-}" ]]; then
            echo "::error::Add Metal_URL (direct EXE download URL)."
            echo "::error::Apple gates this download behind a Developer account; the Windows runner cannot fetch it itself."
            exit 1
          fi
          if [[ -z "${METAL_TOOLS_SHA256:-}" ]]; then
            echo "MetalTools_SHA256 is not set; the workflow will calculate and report the downloaded installer hash."
          fi

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nx2apple/frontend-qt/requirements.txt

      - name: Restore cached Python environment
        id: python-venv-cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: nx2apple-python-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('nx2apple/frontend-qt/requirements.txt', '.github/workflows/nx2apple-windows-test.yml') }}

      - name: Calculate game archive cache key
        id: game-cache-key
        shell: bash
        run: |
          set -euo pipefail
          URL_HASH="$(printf '%s' "$GAME_URL" | sha256sum | cut -d' ' -f1)"
          echo "url_hash=$URL_HASH" >> "$GITHUB_OUTPUT"
          echo "Game archive cache key fingerprint: $URL_HASH"

      - name: Restore cached game archive
        id: game-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nx2apple-inputs/game-archive
          key: nx2apple-game-archive-${{ steps.game-cache-key.outputs.url_hash }}

      - name: Locate and validate 7-Zip RAR5 extractor
        shell: pwsh
        run: |
          $candidates = @()
          $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          $candidates += @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )
          $sevenZip = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $sevenZip) { throw "7-Zip was not found on this Windows runner; cannot extract the RAR5 game archive." }
          $sevenZipDir = Split-Path -Parent $sevenZip
          $sevenZipDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $sevenZip i | Select-String -Pattern "7-Zip|RAR"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip validation failed (exit $LASTEXITCODE)." }
          Write-Host "Using RAR5-capable extractor: $sevenZip"
          "7-Zip path: $sevenZip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check restored Metal Developer Tools
        id: metal-cache-check
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from nspb_qt.win import toolchain as tc

          install_dir = Path(os.environ["RUNNER_TEMP"]) / "metal-developer-tools"
          root = tc.resolve_metal_dir(install_dir)
          metal = tc.metal_tool("metal", sdk="iphoneos") if root else None
          metallib = tc.metal_tool("metallib", sdk="iphoneos") if root else None
          if root and metal and metallib:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"NSPB_METAL_DIR={root}\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("ready=true\n")
              print(f"Restored Metal tools are valid: {metal}; {metallib}")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("ready=false\n")
              print("No complete cached Metal installation; installer will run.")
          PY

      - name: Install Apple Metal Developer Tools for Windows
        if: steps.metal-cache-check.outputs.ready != 'true'
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import http.cookiejar
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from nspb_qt.win import toolchain as tc

          class DriveDownloadParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.anchors = []
                  self._form = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self._form = {"action": a.get("action", ""), "method": a.get("method", "get").lower(), "fields": {}}
                  elif tag == "input" and self._form is not None and a.get("name"):
                      self._form["fields"][a["name"]] = a.get("value", "")
                  elif tag == "a" and a.get("href"):
                      self.anchors.append(a["href"])
              def handle_endtag(self, tag):
                  if tag == "form" and self._form is not None:
                      self.forms.append(self._form)
                      self._form = None

          url = os.environ["METAL_TOOLS_URL"].strip()
          expected = os.environ.get("METAL_TOOLS_SHA256", "").strip().lower()
          if expected and (len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected)):
              raise SystemExit("If supplied, MetalTools_SHA256 must be a 64-character hexadecimal SHA-256.")

          # Convert ordinary Google Drive viewer/share URLs into the current
          # download endpoint before fetching. A /file/d/.../view URL returns
          # the 100+ KB Drive viewer HTML, not the executable.
          parsed_input = urllib.parse.urlparse(url)
          input_host = (parsed_input.hostname or "").lower()
          if input_host.endswith("google.com") or input_host.endswith("googleusercontent.com"):
              query = urllib.parse.parse_qs(parsed_input.query)
              file_id = query.get("id", [None])[0]
              match = re.search(r"/file/d/([^/]+)", parsed_input.path)
              if match:
                  file_id = match.group(1)
              if file_id:
                  download_query = {"id": file_id, "export": "download", "confirm": "t"}
                  resource_key = query.get("resourcekey", [None])[0]
                  if resource_key:
                      download_query["resourcekey"] = resource_key
                  url = "https://drive.usercontent.google.com/download?" + urllib.parse.urlencode(download_query)
                  print("Normalized Google Drive share/view URL to its direct file-download endpoint.")
              elif input_host == "drive.usercontent.google.com" and "confirm" not in query:
                  query["confirm"] = ["t"]
                  url = urllib.parse.urlunparse(parsed_input._replace(query=urllib.parse.urlencode(query, doseq=True)))
                  print("Added Google Drive download confirmation parameter.")

          cookies = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          request_headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36"}
          def fetch(target):
              req = urllib.request.Request(target, headers=request_headers)
              return opener.open(req, timeout=120)

          installer = Path(os.environ["RUNNER_TEMP"]) / "metal-developer-tools-windows.exe"
          print("Downloading Apple's Metal Developer Tools for Windows installer...")
          response = fetch(url)
          body = response.read()
          content_type = response.headers.get("Content-Type", "")
          final_url = response.geturl()
          print(f"Initial response: HTTP {response.status}, {len(body):,} bytes, content-type={content_type}")

          # Google Drive sharing links often return an HTML virus-scan/confirmation
          # interstitial instead of the file. Parse its download form and replay it
          # with the same cookie jar rather than treating that HTML as a bad URL.
          if body.lstrip().lower().startswith((b"<!doctype html", b"<html")) or "text/html" in content_type.lower():
              parsed_url = urllib.parse.urlparse(final_url)
              host = (parsed_url.hostname or "").lower()
              if host.endswith("google.com") or host.endswith("googleusercontent.com") or "drive.google.com" in url.lower():
                  parser = DriveDownloadParser()
                  parser.feed(body.decode("utf-8", errors="replace"))
                  download_target = None
                  for form in parser.forms:
                      action = urllib.parse.urljoin(final_url, form["action"])
                      fields = form["fields"]
                      if form["method"] == "get" and ("id" in fields or "export" in fields or "confirm" in fields):
                          download_target = action + ("&" if "?" in action else "?") + urllib.parse.urlencode(fields)
                          break
                      if form["method"] == "post" and fields:
                          data = urllib.parse.urlencode(fields).encode()
                          req = urllib.request.Request(action, data=data, headers=request_headers)
                          confirmed = opener.open(req, timeout=120)
                          body = confirmed.read()
                          content_type = confirmed.headers.get("Content-Type", "")
                          final_url = confirmed.geturl()
                          download_target = None
                          break
                  if download_target:
                      print("Google Drive confirmation form detected; requesting the confirmed download...")
                      response = fetch(download_target)
                      body = response.read()
                      content_type = response.headers.get("Content-Type", "")
                      final_url = response.geturl()
                  elif body.lstrip().lower().startswith((b"<!doctype html", b"<html")) or "text/html" in content_type.lower():
                      # Some Drive pages expose a confirmation URL as an anchor.
                      for href in parser.anchors:
                          candidate = urllib.parse.urljoin(final_url, href)
                          if "export=download" in candidate or "confirm=" in candidate:
                              print("Google Drive confirmation link detected; following it...")
                              response = fetch(candidate)
                              body = response.read()
                              content_type = response.headers.get("Content-Type", "")
                              final_url = response.geturl()
                              break

          print(f"Final download response: {len(body):,} bytes, content-type={content_type}")
          if len(body) < 1024 * 1024:
              preview = body[:160].decode("utf-8", errors="replace").replace("\\n", " ")
              raise SystemExit(
                  f"Metal download is still not the installer ({len(body):,} bytes). "
                  f"Response begins: {preview!r}. Check Drive sharing permissions and confirmation page."
              )
          installer.write_bytes(body)
          with installer.open("rb") as stream:
              header = stream.read(64)
          print(f"Downloaded file header (first 32 bytes): {header[:32].hex()}")
          if len(header) < 64 or header[:2] != b"MZ":
              raise SystemExit("Metal download is not a Windows PE executable (missing MZ header).")
          pe_offset = int.from_bytes(header[0x3C:0x40], "little")
          with installer.open("rb") as stream:
              stream.seek(pe_offset)
              pe_signature = stream.read(4)
          if pe_signature != b"PE\0\0":
              raise SystemExit("Metal download has an MZ header but no valid PE signature.")

          digest = hashlib.sha256()
          with installer.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          print(f"Downloaded Metal installer SHA-256: {actual}")
          if expected and actual != expected:
              raise SystemExit(f"Metal tools SHA-256 mismatch: got {actual}, expected {expected}")
          if not expected:
              print("No pinned checksum supplied; continuing with PE and installer-layout validation.")

          install_dir = Path(os.environ["RUNNER_TEMP"]) / "metal-developer-tools"
          install_dir.mkdir(parents=True, exist_ok=True)
          print(f"Installing Metal Developer Tools silently into {install_dir}...")
          result = subprocess.run(
              [str(installer), "/S", f"/D={install_dir}"],
              capture_output=True, text=True, errors="replace", timeout=900,
          )
          if result.returncode != 0:
              if result.stdout: print(result.stdout[-4000:])
              if result.stderr: print(result.stderr[-4000:])
              raise SystemExit(f"Apple Metal tools installer failed with exit code {result.returncode}.")

          metal_root = tc.resolve_metal_dir(install_dir)
          if metal_root is None:
              raise SystemExit("Installer returned success, but metal.exe was not found. Verify this is Metal Developer Tools for Windows.")
          # metal_tool() resolves its root through NSPB_METAL_DIR / toolchain.json /
          # standard locations. Point it at the just-installed folder before probing.
          os.environ["NSPB_METAL_DIR"] = str(metal_root)
          metal = tc.metal_tool("metal", sdk="iphoneos")
          metallib = tc.metal_tool("metallib", sdk="iphoneos")
          if metal is None or metallib is None:
              raise SystemExit(f"Metal installation is incomplete: metal.exe={metal}, metallib.exe={metallib}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"NSPB_METAL_DIR={metal_root}\n")
          print(f"Metal compiler: {metal}")
          print(f"Metal library tool: {metallib}")
          print(f"Metal Developer Tools installed at: {metal_root}")
          installer.unlink(missing_ok=True)
          PY

      - name: Save Metal Developer Tools cache
        if: ${{ success() && steps.metal-cache-check.outputs.ready != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/metal-developer-tools
          key: nx2apple-metal-${{ runner.os }}-6.2-v1

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install NX2Apple Windows build dependencies
        shell: bash
        run: |
          set -euo pipefail
          VENV="$GITHUB_WORKSPACE/.venv"
          if [[ ! -x "$VENV/Scripts/python.exe" ]]; then
            python -m venv "$VENV"
          fi
          echo "$VENV/Scripts" >> "$GITHUB_PATH"
          VPY="$VENV/Scripts/python.exe"
          if ! "$VPY" -c "import lz4, capstone, unicorn, fontTools, zbic, backports.zstd, nsz, PIL" 2>/dev/null; then
            "$VPY" -m pip install --upgrade pip
            "$VPY" -m pip install \
              lz4==4.4.5 \
              capstone==5.0.9 \
              unicorn==2.1.4 \
              fonttools==4.68.0 \
              zbic==1.0.1.post1 \
              backports.zstd==1.8.0 \
              nsz==5.0.0 \
              pillow
          else
            echo "Restored Python environment already contains all NX2Apple dependencies."
          fi
          "$VPY" -c "import lz4, capstone, unicorn, fontTools, zbic, backports.zstd, nsz, PIL; print('All NX2Apple Python dependencies verified.')"

      - name: Save Python environment cache
        if: ${{ success() && steps.python-venv-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: nx2apple-python-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('nx2apple/frontend-qt/requirements.txt', '.github/workflows/nx2apple-windows-test.yml') }}

      - name: Sync NX2Apple engine and patch queue
        working-directory: nx2apple
        shell: bash
        run: |
          set -euo pipefail
          python tools/engine.py -q sync
          echo "Engine upstream pin: $(cat .upstream-ref)"
          echo "Engine sync complete."

      - name: Restore cached NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\\.nuget\\packages
          key: nx2apple-nuget-${{ runner.os }}-net10-${{ hashFiles('nx2apple/engine/dm/tools/nx_extract/*.csproj', 'nx2apple/engine/dm/tools/nx_extract/*.props', 'nx2apple/engine/dm/tools/nx_extract/*.targets') }}

      - name: Restore cached nx_extract executable
        id: nx-extract-cache
        uses: actions/cache/restore@v4
        with:
          path: nx2apple/engine/dm/tools/nx_extract_bin
          key: nx2apple-nx-extract-${{ runner.os }}-${{ hashFiles('nx2apple/engine/dm/tools/nx_extract/*.cs', 'nx2apple/engine/dm/tools/nx_extract/*.csproj') }}

      - name: Install LLVM-MinGW, iPhoneOS SDK and zstd
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          from nspb_qt.win import fetch, sdk_fetch, toolchain as tc

          llvm_root = fetch.install_llvm(log=print)
          # llvm-mingw ships the unified LLD driver as ld.lld.exe. The runner
          # also has an older system LLVM whose ld64.lld.exe appears on PATH.
          # Create the Mach-O driver alias inside our pinned LLVM tree and
          # explicitly point the doctor/build at that tree.
          lld_source = llvm_root / "bin" / "ld.lld.exe"
          lld_target = llvm_root / "bin" / "ld64.lld.exe"
          if not lld_source.is_file():
              raise SystemExit(f"Pinned LLVM-MinGW linker is missing: {lld_source}")
          if not tc._lld_has_macho(lld_source):
              raise SystemExit(f"Pinned LLVM-MinGW LLD has no Mach-O driver: {lld_source}")
          shutil.copy2(lld_source, lld_target)
          os.environ["NSPB_LLVM_DIR"] = str(llvm_root)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"NSPB_LLVM_DIR={llvm_root}\n")
          print(f"Using pinned Mach-O linker: {lld_target}")
          print(f"Linker version: {tc.subprocess.run([str(lld_target), '--version'], capture_output=True, text=True, check=True).stdout.strip()}")

          sdk_fetch.install_sdk(log=print)
          fetch.install_zstd(log=print)
          PY

      - name: Save Windows toolchain cache
        if: ${{ success() && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\NS Port Builder\tools
            ~\AppData\Local\NS Port Builder\sdks
          key: nx2apple-toolchain-${{ runner.os }}-${{ hashFiles('nx2apple/frontend-qt/nspb_qt/win/toolchain.py', 'nx2apple/frontend-qt/nspb_qt/win/fetch.py', 'nx2apple/frontend-qt/nspb_qt/win/sdk_fetch.py') }}

      - name: Build the Windows SPIRV-Cross tool for the synced engine
        working-directory: nx2apple
        shell: bash
        run: |
          set -euo pipefail

          TOOL_DIR="engine/dm/gfx/tools/spirv_cross_bin"
          TAG="$(sed -n 's/^TAG=\([^ ]*\).*/\1/p' "$TOOL_DIR/build.sh")"
          COMMIT="$(sed -n 's/^COMMIT=\([^ ]*\).*/\1/p' "$TOOL_DIR/build.sh")"
          if [[ -z "$TAG" || -z "$COMMIT" ]]; then
            echo "::error::Could not read the pinned SPIRV-Cross tag/commit from $TOOL_DIR/build.sh"
            exit 1
          fi

          git clone --quiet --depth 1 --branch "$TAG" https://github.com/KhronosGroup/SPIRV-Cross.git spirv-cross-src
          ACTUAL="$(git -C spirv-cross-src rev-parse HEAD)"
          if [[ "$ACTUAL" != "$COMMIT" ]]; then
            echo "::error::SPIRV-Cross checkout $ACTUAL does not match expected commit $COMMIT"
            exit 1
          fi

          cmake -S spirv-cross-src -B spirv-cross-build \
            -DSPIRV_CROSS_ENABLE_TESTS=OFF \
            -DSPIRV_CROSS_SKIP_INSTALL=ON
          cmake --build spirv-cross-build --config Release --target spirv-cross --parallel

          SPV_EXE="$(find spirv-cross-build -type f -name 'spirv-cross.exe' | head -1)"
          if [[ -z "$SPV_EXE" || ! -f "$SPV_EXE" ]]; then
            echo "::error::Windows SPIRV-Cross executable was not produced."
            exit 1
          fi

          cp "$SPV_EXE" "$TOOL_DIR/spirv-cross.exe"
          "$TOOL_DIR/spirv-cross.exe" --revision
          echo "NSPB_SPIRV_CROSS=$GITHUB_WORKSPACE/nx2apple/$TOOL_DIR/spirv-cross.exe" >> "$GITHUB_ENV"

      - name: Validate the Windows cross-toolchain
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python -m nspb_qt.win.doctor 2>&1 | tee "$RUNNER_TEMP/nx2apple-toolchain-report.txt"

      - name: Download Sea of Stars inputs and decode prod.keys
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nx2apple-inputs"
          GAME_DIR="$WORK/GameFiles"
          mkdir -p "$GAME_DIR"

          download_file() {
            local url="$1"
            local output="$2"
            local temporary="$output.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required game download URL secret is empty."
              exit 1
            fi

            echo "Downloading $(basename "$output")..."
            curl --fail --location --show-error --progress-bar \
              --retry 3 --retry-delay 5 --connect-timeout 30 \
              --output "$temporary" "$url"

            if [[ ! -s "$temporary" ]]; then
              echo "::error::Downloaded file is empty: $(basename "$output")"
              exit 1
            fi

            mv "$temporary" "$output"
            ls -lh "$output"
          }

          if [[ -s "$WORK/game-archive" ]]; then
            echo "Using restored game archive cache:"
            ls -lh "$WORK/game-archive"
          else
            download_file "$GAME_URL" "$WORK/game-archive"
          fi

          # Game_URL supplies a RAR5 archive, not a raw NSP. Use the validated
          # Windows 7-Zip installation, then require exactly one base-game NSP.
          EXTRACT_DIR="$WORK/base-game-extracted"
          mkdir -p "$EXTRACT_DIR"
          echo "Inspecting downloaded game file signature and metadata..."
          python - "$WORK/game-archive" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          size = path.stat().st_size
          digest = hashlib.sha256()
          with path.open("rb") as stream:
              head = stream.read(64)
              digest.update(head)
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)

          signatures = {
              b"PK\x03\x04": "ZIP",
              b"Rar!\x1a\x07": "RAR",
              b"7z\xbc\xaf\x27\x1c": "7-Zip",
              b"\x1f\x8b": "GZIP",
              b"BZh": "BZIP2",
              b"\xfd7zXZ\x00": "XZ",
              b"\x28\xb5\x2f\xfd": "Zstandard",
              b"PFS0": "Nintendo Switch PFS0/NSP (not an archive wrapper)",
              b"NSZ": "NSZ",
              b"\x1f\x8b\x08": "GZIP (possible tar.gz)",
          }
          detected = next((name for magic, name in signatures.items() if head.startswith(magic)), "unknown")
          print(f"Downloaded path: {path.name}")
          print(f"File size: {size:,} bytes")
          print(f"First 64 bytes (hex): {head.hex()}")
          print(f"Detected signature: {detected}")
          print(f"SHA-256: {digest.hexdigest()}")
          PY
          echo "Listing RAR5 archive contents with 7-Zip..."
          7z l -slt "$WORK/game-archive" | tee "$WORK/archive-listing.txt"
          echo "Extracting game archive with 7-Zip..."
          7z x -y "-o$EXTRACT_DIR" "$WORK/game-archive"

          mapfile -d '' NSP_FILES < <(find "$EXTRACT_DIR" -type f -iname '*.nsp' -print0)
          if (( ${#NSP_FILES[@]} != 1 )); then
            echo "::error::Expected exactly one base-game NSP in the downloaded archive; found ${#NSP_FILES[@]}."
            find "$EXTRACT_DIR" -maxdepth 4 -type f -printf '%p (%s bytes)\\n' | head -100
            exit 1
          fi
          mv "${NSP_FILES[0]}" "$GAME_DIR/game.nsp"
          echo "Extracted base NSP:"
          ls -lh "$GAME_DIR/game.nsp"
          python - "$GAME_DIR/game.nsp" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              header = stream.read(4)
          if header != b"PFS0":
              raise SystemExit(f"Extracted file is not an NSP/PFS0 package; first bytes: {header.hex()}")
          print(f"Verified NSP/PFS0 header: {path.stat().st_size:,} bytes")
          PY

          case "$CONTENT_SELECTION" in
            "Base game only")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=false
              ;;
            "Base game + update (no DLC)")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=false
              ;;
            "Base game + DLC (no update)")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=true
              ;;
            "Base game + update + DLC")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=true
              ;;
            *)
              echo "::error::Unknown content selection: $CONTENT_SELECTION"
              exit 1
              ;;
          esac

          if [[ "$INCLUDE_UPDATE" == true ]]; then
            download_file "$UPDATE_URL" "$GAME_DIR/update.nsp"
          fi
          if [[ "$INCLUDE_DLC" == true ]]; then
            download_file "$DLC_URL" "$GAME_DIR/dlc.nsp"
          fi

          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::The Keys_URL secret is empty."
            exit 1
          fi

          python - "$WORK/prod.keys" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          encoded = re.sub(r"\s+", "", os.environ["KEYS_BASE64"].strip())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Invalid Base64 encryption keys: {exc}")
          if not decoded:
              raise SystemExit("Decoded prod.keys is empty.")
          output = Path(sys.argv[1])
          output.write_bytes(decoded)
          output.chmod(0o600)
          print(f"Decoded prod.keys ({len(decoded):,} bytes).")
          PY

          echo "Game input files prepared. Keys are not included in artifacts."

      - name: Save downloaded game archive cache
        if: ${{ success() && steps.game-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nx2apple-inputs/game-archive
          key: nx2apple-game-archive-${{ steps.game-cache-key.outputs.url_hash }}

      - name: Prebuild nx_extract outside the driver process group
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from nspb_qt.win import toolchain as tc

          repo = Path(os.environ["NSPB_REPO"])
          project_dir = repo / "dm/tools/nx_extract"
          project = project_dir / "nx_extract.csproj"
          if not project.is_file():
              raise SystemExit(f"NX2Apple extractor project is missing: {project}")

          # Reuse a previously completed extractor build only when its embedded
          # source fingerprint matches the current synced engine source.
          import hashlib
          source_hash = hashlib.sha256()
          for source in sorted([*project_dir.glob("*.cs"), *project_dir.glob("*.csproj")], key=lambda p: p.name):
              source_hash.update(source.name.encode("utf-8") + b"\0" + source.read_bytes() + b"\0")
          expected_source_sha = source_hash.hexdigest()[:16]
          bundled = repo / "dm/tools/nx_extract_bin"
          cached_exe = bundled / "nx_extract.exe"
          if cached_exe.is_file():
              probe = subprocess.run([str(cached_exe), "--source-sha"], capture_output=True, text=True, errors="replace", timeout=60)
              if probe.returncode == 0 and probe.stdout.strip() == expected_source_sha:
                  print("Reusing cached nx_extract executable for source", expected_source_sha)
                  raise SystemExit(0)
              print("Cached nx_extract is stale or invalid; rebuilding it.")

          dotnet_root = tc.dotnet_dir()
          if dotnet_root is None:
              raise SystemExit(".NET SDK was installed but its dotnet.exe could not be located.")
          dotnet = dotnet_root / "dotnet.exe"

          output = Path(os.environ["RUNNER_TEMP"]) / "nx-extract-prebuilt"
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "nx-extract-build-artifacts"
          shutil.rmtree(output, ignore_errors=True)
          shutil.rmtree(artifacts, ignore_errors=True)
          output.mkdir(parents=True, exist_ok=True)

          extra = tc.csc_tool_args()
          if not any(arg.startswith("-p:UseSharedCompilation=") for arg in extra):
              extra.append("-p:UseSharedCompilation=false")

          command = [
              str(dotnet), "build", str(project), "-c", "Release",
              "-p:PublishAot=false", *extra,
              "--artifacts-path", str(artifacts),
              "-o", str(output), "-v", "quiet", "-nologo", "-nr:false",
          ]
          env = os.environ.copy()
          env.update({
              "MSBUILDDISABLENODEREUSE": "1",
              "DOTNET_CLI_USE_MSBUILD_SERVER": "0",
              "DOTNET_CLI_TELEMETRY_OPTOUT": "1",
              "MSBUILD_TELEMETRY_OPTOUT": "1",
          })

          tools = tc.tools_dir()
          tools.mkdir(parents=True, exist_ok=True)
          build_log = tools / "nx_extract_build.log"
          print("Building nx_extract separately so the Windows driver does not own MSBuild worker processes.")
          print("Command:", subprocess.list2cmdline(command))
          with build_log.open("w", encoding="utf-8", errors="replace") as log:
              result = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT)
          print(build_log.read_text(encoding="utf-8", errors="replace")[-12000:])
          if result.returncode:
              raise SystemExit(f"nx_extract prebuild failed with exit code {result.returncode}; see {build_log}")

          built_exe = output / "nx_extract.exe"
          if not built_exe.is_file():
              raise SystemExit(f".NET build succeeded but did not produce {built_exe}")

          # The Windows driver checks this bundled location before attempting its own
          # process-group-managed dotnet build. It also verifies the embedded source hash.
          bundled.mkdir(parents=True, exist_ok=True)
          for item in output.iterdir():
              target = bundled / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)

          probe = subprocess.run(
              [str(bundled / "nx_extract.exe"), "--source-sha"],
              capture_output=True, text=True, errors="replace", env=env, timeout=60,
          )
          if probe.returncode or not probe.stdout.strip():
              raise SystemExit(
                  "Prebuilt nx_extract failed its startup/source-hash probe: "
                  + (probe.stderr or probe.stdout or f"exit {probe.returncode}")
              )
          print("Prebuilt nx_extract is ready:", bundled / "nx_extract.exe")
          print("Embedded source SHA:", probe.stdout.strip())
          PY

      - name: Save NuGet package cache
        if: ${{ success() && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~\\.nuget\\packages
          key: nx2apple-nuget-${{ runner.os }}-net10-${{ hashFiles('nx2apple/engine/dm/tools/nx_extract/*.csproj', 'nx2apple/engine/dm/tools/nx_extract/*.props', 'nx2apple/engine/dm/tools/nx_extract/*.targets') }}

      - name: Save nx_extract executable cache
        if: ${{ success() && steps.nx-extract-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: nx2apple/engine/dm/tools/nx_extract_bin
          key: nx2apple-nx-extract-${{ runner.os }}-${{ hashFiles('nx2apple/engine/dm/tools/nx_extract/*.cs', 'nx2apple/engine/dm/tools/nx_extract/*.csproj') }}

      - name: Build unsigned iOS IPA with NX2Apple Windows driver
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          # The Windows process-group wrapper otherwise kills compiler descendants
          # only 5 seconds after own_compilers.py exits. Metal can still be flushing
          # completed shader outputs, so give the child job 90 seconds to drain.
          python -c 'import nspb_qt.win.driver as driver; driver._WinProcGroup.DRAIN = 90.0; raise SystemExit(driver.main())' \
            "$RUNNER_TEMP/nx2apple-inputs/GameFiles" \
            -k "$RUNNER_TEMP/nx2apple-inputs/prod.keys" \
            --platform ios 2>&1 | tee "$RUNNER_TEMP/nx2apple-windows-build.log"

      - name: Capture full NX2Apple extractor build diagnostics
        if: always()
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:LOCALAPPDATA 'NS Port Builder\tools'
          $log = Join-Path $toolsDir 'nx_extract_build.log'
          $diag = Join-Path $env:RUNNER_TEMP 'nx2apple-extra-diagnostics'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          Write-Host "NX2Apple tools directory: $toolsDir"
          if (Test-Path -LiteralPath $log) {
            Copy-Item -LiteralPath $log -Destination (Join-Path $diag 'nx_extract_build.log') -Force
            $item = Get-Item -LiteralPath $log
            Write-Host "Full nx_extract build log: $($item.Length) bytes"
            Write-Host '----- nx_extract_build.log (last 250 lines) -----'
            Get-Content -LiteralPath $log -Tail 250
            Write-Host '----- end nx_extract_build.log -----'
          } else {
            Write-Host 'nx_extract_build.log was not created at the expected tools path.'
            Get-ChildItem -LiteralPath $toolsDir -Force -ErrorAction SilentlyContinue |
              Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
          }
          $extractCache = Get-ChildItem -LiteralPath $toolsDir -Directory -Filter 'nx_extract-*' -ErrorAction SilentlyContinue
          foreach ($dir in $extractCache) {
            Write-Host "Extractor cache: $($dir.FullName)"
            Get-ChildItem -LiteralPath $dir.FullName -Force -ErrorAction SilentlyContinue |
              Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
            Copy-Item -LiteralPath $dir.FullName -Destination (Join-Path $diag $dir.Name) -Recurse -Force
          }
          # Preserve the shader compiler's complete log: the process-group failure
          # happens after shader generation and this is the best evidence of its child tools.
          $gameRoot = Join-Path $env:RUNNER_TEMP 'nx2apple-inputs/GameFiles'
          $buildDirs = Get-ChildItem -LiteralPath $gameRoot -Directory -Filter '*_build' -ErrorAction SilentlyContinue
          foreach ($buildDir in $buildDirs) {
            $shaderLog = Join-Path $buildDir.FullName 'logs/dmsh_build.log'
            if (Test-Path -LiteralPath $shaderLog) {
              $dest = Join-Path $diag ("dmsh_build-" + $buildDir.Name + ".log")
              Copy-Item -LiteralPath $shaderLog -Destination $dest -Force
              Write-Host "Saved shader compiler log: $dest ($((Get-Item -LiteralPath $shaderLog).Length) bytes)"
            }
          }
          Write-Host '----- remaining compiler and dotnet processes after driver -----'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('dotnet.exe','metal.exe','metallib.exe','clang.exe','clang++.exe','python.exe') } |
            Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List
          Write-Host '----- end process snapshot -----'

      - name: Collect generated IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nx2apple-ipa-output"
          mkdir -p "$OUT"

          mapfile -d '' IPA_FILES < <(
            find "$GITHUB_WORKSPACE/nx2apple" "$RUNNER_TEMP" \
              -type f -iname '*.ipa' \
              -not -path "$RUNNER_TEMP/nx2apple-inputs/*" \
              -print0
          )

          if (( ${#IPA_FILES[@]} == 0 )); then
            echo "::error::The driver returned success, but no IPA was found in the workspace or runner temp folder."
            exit 1
          fi

          for ipa in "${IPA_FILES[@]}"; do
            cp "$ipa" "$OUT/$(basename "$ipa")"
            echo "Collected IPA: $(basename "$ipa")"
          done

          echo "Found ${#IPA_FILES[@]} IPA file(s)." >> "$GITHUB_STEP_SUMMARY"
          echo "IPA output is held on the runner. Upload is controlled by the workflow input." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact (opt-in)
        if: ${{ success() && inputs.upload_ipa }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NX2Apple-Windows-IPA
          path: ${{ runner.temp }}/nx2apple-ipa-output/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Save Windows build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "## NX2Apple Windows test"
            echo
            echo "- Runner: windows-latest"
            echo "- NX2Apple revision: $(git -C nx2apple rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Engine pin: $(cat nx2apple/.upstream-ref 2>/dev/null || echo unavailable)"
            echo "- Content selection: $CONTENT_SELECTION"
            echo "- Job status: ${{ job.status }}"
            echo
            echo "The IPA is uploaded only when the manual upload_ipa input is enabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NX2Apple-Windows-Diagnostics
          path: |
            ${{ runner.temp }}/nx2apple-toolchain-report.txt
            ${{ runner.temp }}/nx2apple-windows-build.log
            ${{ runner.temp }}/nx2apple-extra-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
