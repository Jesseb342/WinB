name: NX2Apple Windows IPA test

on:
  workflow_dispatch:
    inputs:
      content:
        description: Game content to include (Echoes of Wisdom test)
        type: choice
        required: true
        default: Base game + update (no DLC)
        options:
          - Base game only
          - Base game + update (no DLC)
          - Base game + DLC (no update)
          - Base game + update + DLC
      upload_ipa:
        description: Upload the IPA as an Actions artifact. On a public repo, anyone with read access may be able to download it.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: nx2apple-windows-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-ipa:
    name: Build iOS IPA on Windows (NX2Apple)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      NSPB_REPO: ${{ github.workspace }}/nx2apple
      GAME_URL: ${{ secrets.Game_URL }}
      UPDATE_URL: ${{ secrets.Update_URL }}
      DLC_URL: ${{ secrets.DLC_URL }}
      KEYS_BASE64: ${{ secrets.Keys_URL }}
      METAL_TOOLS_URL: ${{ secrets.Metal_URL || secrets.MetalTools_URL }}
      METAL_TOOLS_SHA256: ${{ secrets.MetalTools_SHA256 }}
      # NX2Apple logs Unicode symbols during extraction; force UTF-8 for piped Python output on Windows.
      PYTHONUTF8: "1"
      CONTENT_SELECTION: ${{ inputs.content }}

    steps:
      - name: Checkout WinB workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest NX2Apple
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LNPANDY/NX2Apple
          ref: main
          path: nx2apple
          fetch-depth: 1
          persist-credentials: false

      - name: Record NX2Apple revision
        shell: bash
        run: |
          set -euo pipefail
          echo "NX2Apple commit: $(git -C nx2apple rev-parse HEAD)"
          echo "NX2Apple commit: $(git -C nx2apple rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets before toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GAME_URL:-}" || -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Add the Game_URL and Keys_URL repository secrets (same values used by Wiz)."
            exit 1
          fi
          case "$CONTENT_SELECTION" in
            "Base game + update (no DLC)"|"Base game + update + DLC")
              if [[ -z "${UPDATE_URL:-}" ]]; then
                echo "::error::The selected content needs the Update_URL repository secret."
                exit 1
              fi
              ;;
          esac
          case "$CONTENT_SELECTION" in
            "Base game + DLC (no update)"|"Base game + update + DLC")
              if [[ -z "${DLC_URL:-}" ]]; then
                echo "::error::The selected content needs the DLC_URL repository secret."
                exit 1
              fi
              ;;
          esac
          if [[ -z "${METAL_TOOLS_URL:-}" ]]; then
            echo "::error::Add Metal_URL (direct EXE download URL)."
            echo "::error::Apple gates this download behind a Developer account; the Windows runner cannot fetch it itself."
            exit 1
          fi
          if [[ -z "${METAL_TOOLS_SHA256:-}" ]]; then
            echo "MetalTools_SHA256 is not set; the workflow will calculate and report the downloaded installer hash."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nx2apple/frontend-qt/requirements.txt

      - name: Install Apple Metal Developer Tools for Windows
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import http.cookiejar
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from nspb_qt.win import toolchain as tc

          class DriveDownloadParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.anchors = []
                  self._form = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self._form = {"action": a.get("action", ""), "method": a.get("method", "get").lower(), "fields": {}}
                  elif tag == "input" and self._form is not None and a.get("name"):
                      self._form["fields"][a["name"]] = a.get("value", "")
                  elif tag == "a" and a.get("href"):
                      self.anchors.append(a["href"])
              def handle_endtag(self, tag):
                  if tag == "form" and self._form is not None:
                      self.forms.append(self._form)
                      self._form = None

          url = os.environ["METAL_TOOLS_URL"].strip()
          expected = os.environ.get("METAL_TOOLS_SHA256", "").strip().lower()
          if expected and (len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected)):
              raise SystemExit("If supplied, MetalTools_SHA256 must be a 64-character hexadecimal SHA-256.")

          # Convert ordinary Google Drive viewer/share URLs into the current
          # download endpoint before fetching. A /file/d/.../view URL returns
          # the 100+ KB Drive viewer HTML, not the executable.
          parsed_input = urllib.parse.urlparse(url)
          input_host = (parsed_input.hostname or "").lower()
          if input_host.endswith("google.com") or input_host.endswith("googleusercontent.com"):
              query = urllib.parse.parse_qs(parsed_input.query)
              file_id = query.get("id", [None])[0]
              match = re.search(r"/file/d/([^/]+)", parsed_input.path)
              if match:
                  file_id = match.group(1)
              if file_id:
                  download_query = {"id": file_id, "export": "download", "confirm": "t"}
                  resource_key = query.get("resourcekey", [None])[0]
                  if resource_key:
                      download_query["resourcekey"] = resource_key
                  url = "https://drive.usercontent.google.com/download?" + urllib.parse.urlencode(download_query)
                  print("Normalized Google Drive share/view URL to its direct file-download endpoint.")
              elif input_host == "drive.usercontent.google.com" and "confirm" not in query:
                  query["confirm"] = ["t"]
                  url = urllib.parse.urlunparse(parsed_input._replace(query=urllib.parse.urlencode(query, doseq=True)))
                  print("Added Google Drive download confirmation parameter.")

          cookies = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          request_headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36"}
          def fetch(target):
              req = urllib.request.Request(target, headers=request_headers)
              return opener.open(req, timeout=120)

          installer = Path(os.environ["RUNNER_TEMP"]) / "metal-developer-tools-windows.exe"
          print("Downloading Apple's Metal Developer Tools for Windows installer...")
          response = fetch(url)
          body = response.read()
          content_type = response.headers.get("Content-Type", "")
          final_url = response.geturl()
          print(f"Initial response: HTTP {response.status}, {len(body):,} bytes, content-type={content_type}")

          # Google Drive sharing links often return an HTML virus-scan/confirmation
          # interstitial instead of the file. Parse its download form and replay it
          # with the same cookie jar rather than treating that HTML as a bad URL.
          if body.lstrip().lower().startswith((b"<!doctype html", b"<html")) or "text/html" in content_type.lower():
              parsed_url = urllib.parse.urlparse(final_url)
              host = (parsed_url.hostname or "").lower()
              if host.endswith("google.com") or host.endswith("googleusercontent.com") or "drive.google.com" in url.lower():
                  parser = DriveDownloadParser()
                  parser.feed(body.decode("utf-8", errors="replace"))
                  download_target = None
                  for form in parser.forms:
                      action = urllib.parse.urljoin(final_url, form["action"])
                      fields = form["fields"]
                      if form["method"] == "get" and ("id" in fields or "export" in fields or "confirm" in fields):
                          download_target = action + ("&" if "?" in action else "?") + urllib.parse.urlencode(fields)
                          break
                      if form["method"] == "post" and fields:
                          data = urllib.parse.urlencode(fields).encode()
                          req = urllib.request.Request(action, data=data, headers=request_headers)
                          confirmed = opener.open(req, timeout=120)
                          body = confirmed.read()
                          content_type = confirmed.headers.get("Content-Type", "")
                          final_url = confirmed.geturl()
                          download_target = None
                          break
                  if download_target:
                      print("Google Drive confirmation form detected; requesting the confirmed download...")
                      response = fetch(download_target)
                      body = response.read()
                      content_type = response.headers.get("Content-Type", "")
                      final_url = response.geturl()
                  elif body.lstrip().lower().startswith((b"<!doctype html", b"<html")) or "text/html" in content_type.lower():
                      # Some Drive pages expose a confirmation URL as an anchor.
                      for href in parser.anchors:
                          candidate = urllib.parse.urljoin(final_url, href)
                          if "export=download" in candidate or "confirm=" in candidate:
                              print("Google Drive confirmation link detected; following it...")
                              response = fetch(candidate)
                              body = response.read()
                              content_type = response.headers.get("Content-Type", "")
                              final_url = response.geturl()
                              break

          print(f"Final download response: {len(body):,} bytes, content-type={content_type}")
          if len(body) < 1024 * 1024:
              preview = body[:160].decode("utf-8", errors="replace").replace("\\n", " ")
              raise SystemExit(
                  f"Metal download is still not the installer ({len(body):,} bytes). "
                  f"Response begins: {preview!r}. Check Drive sharing permissions and confirmation page."
              )
          installer.write_bytes(body)
          with installer.open("rb") as stream:
              header = stream.read(64)
          print(f"Downloaded file header (first 32 bytes): {header[:32].hex()}")
          if len(header) < 64 or header[:2] != b"MZ":
              raise SystemExit("Metal download is not a Windows PE executable (missing MZ header).")
          pe_offset = int.from_bytes(header[0x3C:0x40], "little")
          with installer.open("rb") as stream:
              stream.seek(pe_offset)
              pe_signature = stream.read(4)
          if pe_signature != b"PE\0\0":
              raise SystemExit("Metal download has an MZ header but no valid PE signature.")

          digest = hashlib.sha256()
          with installer.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          print(f"Downloaded Metal installer SHA-256: {actual}")
          if expected and actual != expected:
              raise SystemExit(f"Metal tools SHA-256 mismatch: got {actual}, expected {expected}")
          if not expected:
              print("No pinned checksum supplied; continuing with PE and installer-layout validation.")

          install_dir = Path(os.environ["RUNNER_TEMP"]) / "metal-developer-tools"
          install_dir.mkdir(parents=True, exist_ok=True)
          print(f"Installing Metal Developer Tools silently into {install_dir}...")
          result = subprocess.run(
              [str(installer), "/S", f"/D={install_dir}"],
              capture_output=True, text=True, errors="replace", timeout=900,
          )
          if result.returncode != 0:
              if result.stdout: print(result.stdout[-4000:])
              if result.stderr: print(result.stderr[-4000:])
              raise SystemExit(f"Apple Metal tools installer failed with exit code {result.returncode}.")

          metal_root = tc.resolve_metal_dir(install_dir)
          if metal_root is None:
              raise SystemExit("Installer returned success, but metal.exe was not found. Verify this is Metal Developer Tools for Windows.")
          metal = tc.metal_tool("metal", sdk="iphoneos")
          metallib = tc.metal_tool("metallib", sdk="iphoneos")
          if metal is None or metallib is None:
              raise SystemExit(f"Metal installation is incomplete: metal.exe={metal}, metallib.exe={metallib}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"NSPB_METAL_DIR={metal_root}\\n")
          print(f"Metal compiler: {metal}")
          print(f"Metal library tool: {metallib}")
          print(f"Metal Developer Tools installed at: {metal_root}")
          installer.unlink(missing_ok=True)
          PY

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install NX2Apple Windows build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # These are the Windows wheels and versions used by NX2Apple's own packaging workflow.
          python -m pip install \
            lz4==4.4.5 \
            capstone==5.0.9 \
            unicorn==2.1.4 \
            fonttools==4.68.0 \
            zbic==1.0.1.post1 \
            backports.zstd==1.8.0 \
            nsz==5.0.0 \
            pillow

      - name: Sync NX2Apple engine and patch queue
        working-directory: nx2apple
        shell: bash
        run: |
          set -euo pipefail
          python tools/engine.py -q sync
          echo "Engine upstream pin: $(cat .upstream-ref)"
          echo "Engine sync complete."

      - name: Install LLVM-MinGW, iPhoneOS SDK and zstd
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from nspb_qt.win import fetch, sdk_fetch

          fetch.install_llvm(log=print)
          sdk_fetch.install_sdk(log=print)
          fetch.install_zstd(log=print)
          PY

      - name: Build the Windows SPIRV-Cross tool for the synced engine
        working-directory: nx2apple
        shell: bash
        run: |
          set -euo pipefail

          TOOL_DIR="engine/dm/gfx/tools/spirv_cross_bin"
          TAG="$(sed -n 's/^TAG=\([^ ]*\).*/\1/p' "$TOOL_DIR/build.sh")"
          COMMIT="$(sed -n 's/^COMMIT=\([^ ]*\).*/\1/p' "$TOOL_DIR/build.sh")"
          if [[ -z "$TAG" || -z "$COMMIT" ]]; then
            echo "::error::Could not read the pinned SPIRV-Cross tag/commit from $TOOL_DIR/build.sh"
            exit 1
          fi

          git clone --quiet --depth 1 --branch "$TAG" https://github.com/KhronosGroup/SPIRV-Cross.git spirv-cross-src
          ACTUAL="$(git -C spirv-cross-src rev-parse HEAD)"
          if [[ "$ACTUAL" != "$COMMIT" ]]; then
            echo "::error::SPIRV-Cross checkout $ACTUAL does not match expected commit $COMMIT"
            exit 1
          fi

          cmake -S spirv-cross-src -B spirv-cross-build \
            -DSPIRV_CROSS_ENABLE_TESTS=OFF \
            -DSPIRV_CROSS_SKIP_INSTALL=ON
          cmake --build spirv-cross-build --config Release --target spirv-cross --parallel

          SPV_EXE="$(find spirv-cross-build -type f -name 'spirv-cross.exe' | head -1)"
          if [[ -z "$SPV_EXE" || ! -f "$SPV_EXE" ]]; then
            echo "::error::Windows SPIRV-Cross executable was not produced."
            exit 1
          fi

          cp "$SPV_EXE" "$TOOL_DIR/spirv-cross.exe"
          "$TOOL_DIR/spirv-cross.exe" --revision
          echo "NSPB_SPIRV_CROSS=$GITHUB_WORKSPACE/nx2apple/$TOOL_DIR/spirv-cross.exe" >> "$GITHUB_ENV"

      - name: Validate the Windows cross-toolchain
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python -m nspb_qt.win.doctor 2>&1 | tee "$RUNNER_TEMP/nx2apple-toolchain-report.txt"

      - name: Download Echoes of Wisdom inputs and decode prod.keys
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nx2apple-inputs"
          GAME_DIR="$WORK/GameFiles"
          mkdir -p "$GAME_DIR"

          download_file() {
            local url="$1"
            local output="$2"
            local temporary="$output.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required game download URL secret is empty."
              exit 1
            fi

            echo "Downloading $(basename "$output")..."
            curl --fail --location --show-error --progress-bar \
              --retry 3 --retry-delay 5 --connect-timeout 30 \
              --output "$temporary" "$url"

            if [[ ! -s "$temporary" ]]; then
              echo "::error::Downloaded file is empty: $(basename "$output")"
              exit 1
            fi

            mv "$temporary" "$output"
            ls -lh "$output"
          }

          download_file "$GAME_URL" "$GAME_DIR/game.nsp"

          case "$CONTENT_SELECTION" in
            "Base game only")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=false
              ;;
            "Base game + update (no DLC)")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=false
              ;;
            "Base game + DLC (no update)")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=true
              ;;
            "Base game + update + DLC")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=true
              ;;
            *)
              echo "::error::Unknown content selection: $CONTENT_SELECTION"
              exit 1
              ;;
          esac

          if [[ "$INCLUDE_UPDATE" == true ]]; then
            download_file "$UPDATE_URL" "$GAME_DIR/update.nsp"
          fi
          if [[ "$INCLUDE_DLC" == true ]]; then
            download_file "$DLC_URL" "$GAME_DIR/dlc.nsp"
          fi

          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::The Keys_URL secret is empty."
            exit 1
          fi

          python - "$WORK/prod.keys" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          encoded = re.sub(r"\s+", "", os.environ["KEYS_BASE64"].strip())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Invalid Base64 encryption keys: {exc}")
          if not decoded:
              raise SystemExit("Decoded prod.keys is empty.")
          output = Path(sys.argv[1])
          output.write_bytes(decoded)
          output.chmod(0o600)
          print(f"Decoded prod.keys ({len(decoded):,} bytes).")
          PY

          echo "Game input files prepared. Keys are not included in artifacts."

      - name: Build unsigned iOS IPA with NX2Apple Windows driver
        working-directory: nx2apple/frontend-qt
        shell: bash
        run: |
          set -euo pipefail
          python -m nspb_qt.win.driver \
            "$RUNNER_TEMP/nx2apple-inputs/GameFiles" \
            -k "$RUNNER_TEMP/nx2apple-inputs/prod.keys" \
            --platform ios 2>&1 | tee "$RUNNER_TEMP/nx2apple-windows-build.log"

      - name: Collect generated IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nx2apple-ipa-output"
          mkdir -p "$OUT"

          mapfile -d '' IPA_FILES < <(
            find "$GITHUB_WORKSPACE/nx2apple" "$RUNNER_TEMP" \
              -type f -iname '*.ipa' \
              -not -path "$RUNNER_TEMP/nx2apple-inputs/*" \
              -print0
          )

          if (( ${#IPA_FILES[@]} == 0 )); then
            echo "::error::The driver returned success, but no IPA was found in the workspace or runner temp folder."
            exit 1
          fi

          for ipa in "${IPA_FILES[@]}"; do
            cp "$ipa" "$OUT/$(basename "$ipa")"
            echo "Collected IPA: $(basename "$ipa")"
          done

          echo "Found ${#IPA_FILES[@]} IPA file(s)." >> "$GITHUB_STEP_SUMMARY"
          echo "IPA output is held on the runner. Upload is controlled by the workflow input." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact (opt-in)
        if: ${{ success() && inputs.upload_ipa }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NX2Apple-Windows-IPA
          path: ${{ runner.temp }}/nx2apple-ipa-output/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Save Windows build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "## NX2Apple Windows test"
            echo
            echo "- Runner: windows-latest"
            echo "- NX2Apple revision: $(git -C nx2apple rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Engine pin: $(cat nx2apple/.upstream-ref 2>/dev/null || echo unavailable)"
            echo "- Content selection: $CONTENT_SELECTION"
            echo "- Job status: ${{ job.status }}"
            echo
            echo "The IPA is uploaded only when the manual upload_ipa input is enabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NX2Apple-Windows-Diagnostics
          path: |
            ${{ runner.temp }}/nx2apple-toolchain-report.txt
            ${{ runner.temp }}/nx2apple-windows-build.log
          if-no-files-found: warn
          retention-days: 7
